name: Hugo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  HUGO_VERSION: 0.140.2

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint content Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            content/**/*.md
            README.md

  hugo-build:
    name: Hugo build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        run: hugo --minify --gc

  pr-preview:
    name: PR preview deploy
    needs: [markdown-lint, hugo-build]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Preview deploys land on their own Cloudflare Pages branch subdomain
      # (a real site root), so the theme's root-relative links work
      # unmodified — no subpath rewriting needed.
      - name: Build site for preview
        run: hugo --minify --gc --baseURL "https://pr-${{ github.event.number }}.${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}.pages.dev/"

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          directory: ./public
          branch: pr-${{ github.event.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # cloudflare/pages-action only exposes the URL as a step output, it
      # doesn't comment on the PR itself — do that here, updating the same
      # comment on every push instead of piling up a new one each time.
      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            🔗 Preview deployed: ${{ steps.deploy.outputs.alias }}
