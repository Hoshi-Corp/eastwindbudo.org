{{ define "main" }}
<section class="list-hero">
  <h1>{{ .Title }}</h1>
</section>
<div class="list-grid">
  {{ range .Pages.ByDate.Reverse }}
  <a class="post" href="{{ .RelPermalink }}">
    {{ with .Params.tag }}<span class="tag">{{ . }}</span>{{ end }}
    <h3>{{ .Title }}</h3>
    <p>{{ .Params.summary | default .Summary }}</p>
  </a>
  {{ end }}
</div>
{{ end }}
