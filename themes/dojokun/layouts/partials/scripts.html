<script>
  const header = document.getElementById('siteHeader');
  const ensoFill = document.getElementById('ensoFill');
  const CIRC = 314;
  const GAP_FRACTION = 0.04; // enso never fully closes

  function onScroll(){
    const scrollTop = window.scrollY;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const frac = max > 0 ? Math.min(scrollTop / max, 1) : 0;
    const drawn = frac * (1 - GAP_FRACTION);
    ensoFill.setAttribute('stroke-dashoffset', CIRC * (1 - drawn));
    header.classList.toggle('solid', scrollTop > 60);
  }
  document.addEventListener('scroll', onScroll, { passive:true });
  onScroll();

  // Mobile nav toggle
  const navToggle = document.getElementById('navToggle');
  const utilNav = document.getElementById('utilNav');
  const navScrim = document.getElementById('navScrim');
  function setNavOpen(isOpen) {
    utilNav.classList.toggle('open', isOpen);
    navToggle.classList.toggle('is-active', isOpen);
    navToggle.setAttribute('aria-expanded', String(isOpen));
    if (navScrim) navScrim.classList.toggle('open', isOpen);
    document.body.classList.toggle('nav-locked', isOpen);
  }
  if (navToggle && utilNav) {
    navToggle.addEventListener('click', () => {
      setNavOpen(!utilNav.classList.contains('open'));
    });
  }
  if (navScrim) {
    navScrim.addEventListener('click', () => setNavOpen(false));
  }
  document.querySelectorAll('.nav-caret').forEach((btn) => {
    btn.addEventListener('click', () => {
      const item = btn.closest('.nav-item');
      const isOpen = item.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(isOpen));
    });
  });

  // Photo lightbox — shared by lineage entries and team cards
  const photoDialog = document.getElementById('photoLightboxDialog');
  if (photoDialog) {
    const photoDialogImg = document.getElementById('photoLightboxDialogImg');
    const photoDialogCaption = document.getElementById('photoLightboxDialogCaption');
    const photoDialogClose = photoDialog.querySelector('.photo-lightbox-dialog-close');
    document.querySelectorAll('.photo-lightbox-trigger').forEach((btn) => {
      btn.addEventListener('click', () => {
        photoDialogImg.src = btn.dataset.photoSrc;
        photoDialogImg.alt = btn.querySelector('img').alt;
        const name = btn.dataset.photoName || '';
        const note = btn.dataset.photoNote || '';
        photoDialogCaption.textContent = note ? `${name} — ${note}` : name;
        photoDialog.showModal();
      });
    });
    photoDialogClose.addEventListener('click', () => photoDialog.close());
    photoDialog.addEventListener('click', (e) => {
      if (e.target === photoDialog) photoDialog.close();
    });
  }
</script>
