<section class="precept" id="p4">
  <div class="grain"></div>
  <div class="precept-grid">
    <div class="rail">{{ .Params.schedule_rail | default "Schedule" }}</div>
    <div class="stamp-col">
      <div class="stamp"><span>一</span></div>
      <div class="hitotsu">Hitotsu —</div>
    </div>
    <div class="precept-body">
      <h2>{{ .Params.schedule_title }}</h2>
      <p class="lede">{{ .Params.schedule_lede | safeHTML }}</p>
      {{ partial "schedule-board.html" (dict "Schedule" site.Data.fullschedule "Variant" "compact") }}
    </div>
  </div>
</section>
