<section class="precept light-txt" id="p3">
  <div class="grain"></div>
  <div class="precept-grid">
    <div class="rail">{{ .Params.floor_rail | default "The Floor" }}</div>
    <div class="stamp-col">
      <div class="stamp"><span>一</span></div>
      <div class="hitotsu">Hitotsu —</div>
    </div>
    <div class="precept-body">
      <h2>{{ .Params.floor_title | safeHTML }}</h2>
      <p class="lede">{{ .Params.floor_lede | safeHTML }}</p>
      <div class="floor-photo">
        <img src="{{ .Params.floor_image | default "/images/dojo-floor-duotone.jpg" }}" alt="{{ .Params.floor_image_alt | default "East Wind Budo training floor, with the dojo kun scroll on the back wall" }}">
        <div class="cap">{{ .Params.floor_image_caption | default "Our floor — Blossom Park, Ottawa" }}</div>
      </div>
      <ul class="facility-list">
        {{ range .Params.floor_facility_list }}
        <li>{{ . }}</li>
        {{ end }}
      </ul>
    </div>
  </div>
</section>
