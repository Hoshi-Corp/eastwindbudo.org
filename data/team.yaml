members:
  - name: "Kyoshi Mike Sywyk"
    role: "Chief Instructor"
    rank: "8th-degree black belt in Karate, 6th-degree black belt in Kobudo"
    photo: "/images/ourteam/mike-sywyk-white.png"
    details:
      - "40+ years of martial arts training"
      - "Co-founder of Eastwind Martial Arts"
      - "Represented Canada at the Okinawan Karate and Kobudo World Championships in 1995, 1997, and 2001 (4th place, 2001)"
