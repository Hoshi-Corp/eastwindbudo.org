members:
  - name: "Kyoshi Mike Sywyk"
    role: "Chief Instructor"
    rank: "8th-degree black belt in Karate, 6th-degree black belt in Kobudo"
    details:
      - "40+ years of martial arts training"
      - "Co-founder of Eastwind Martial Arts"
      - "Represented Canada at the Okinawan Karate and Kobudo World Championships in 1995, 1997, and 2001 (4th place, 2001)"
      - "Accredited Kyoshi by the Japanese government, 2010"
      - "Continues to make regular trips to Okinawa to train with his teacher, Masaji Taira, 9th dan Hanshi"
  - name: "Kyoshi Laura Sywyk"
    role: "Chief Instructor"
    rank: "7th-degree black belt in Karate, 5th-degree black belt in Kobudo"
    details:
      - "40+ years of martial arts training"
      - "Co-founder of Eastwind Martial Arts"
      - "Represented Canada at the Okinawan Karate and Kobudo World Championships in 1995, 1997, and 2001 (silver medal, 2001)"
      - "Accredited Kyoshi by the Japanese government, 2011"
      - "One of the highest-ranking women instructors in Canadian martial arts"
      - "Continues to make regular trips to Okinawa to train with her teacher, Masaji Taira, 9th dan Hanshi"
